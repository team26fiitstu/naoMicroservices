name: Python tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: python-tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-offline.txt

      - name: Run offline tests
        run: python -m pytest -q tests/test_environment.py services/translator/tests/test_arms_translator.py services/translator/tests/test_translator_routes.py services/naoRobotAPI/tests/test_robot_routes.py services/skeletonFinderAPI/tests/test_skeleton_routes.py
