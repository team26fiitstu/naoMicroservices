apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-to-text-converter-deployment
  labels:
    app: audio-to-text-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-to-text-converter
  template:
    metadata:
      labels:
        app: audio-to-text-converter
    spec:
      containers:
        - name: audio-to-text-converter
          image: ghcr.io/team26fiitstu/audio-to-text-converter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9901
          env:
            - name: FLASK_ENV
              value: "production"
            - name: COMPOSE_NETWORK
              value: "true"
          readinessProbe:
            httpGet:
              path: /test
              port: 9901
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /test
              port: 9901
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: audio-to-text-converter
spec:
  selector:
    app: audio-to-text-converter
  type: ClusterIP
  ports:
    - port: 9901
      targetPort: 9901