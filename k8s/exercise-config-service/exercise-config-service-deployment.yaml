apiVersion: apps/v1
kind: Deployment
metadata:
  name: exercise-config-service-deployment
  labels:
    app: exercise-config-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exercise-config-service
  template:
    metadata:
      labels:
        app: exercise-config-service
    spec:
      containers:
        - name: exercise-config-service
          image: ghcr.io/team26fiitstu/exercise-config-service:sha-a106aee
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7001
          env:
            - name: FLASK_ENV
              value: "production"
            - name: COMPOSE_NETWORK
              value: "true"
            - name: EXERCISES_DIR
              value: "/service/exercises"
            - name: HTTP_RETRY_MAX_ATTEMPTS
              value: "3"
            - name: HTTP_RETRY_BACKOFF_SECONDS
              value: "1"
            - name: HTTP_RETRY_BACKOFF_FACTOR
              value: "2"
            - name: HTTP_RETRY_MAX_BACKOFF_SECONDS
              value: "10"
            - name: HTTP_RETRY_STATUS_CODES
              value: "429,500,502,503,504"
          volumeMounts:
            - name: exercises
              mountPath: /service/exercises
          readinessProbe:
            httpGet:
              path: /health
              port: 7001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7001
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: exercises
          persistentVolumeClaim:
            claimName: exercises-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: exercise-config-service
spec:
  selector:
    app: exercise-config-service
  type: ClusterIP
  ports:
    - port: 7001
      targetPort: 7001
