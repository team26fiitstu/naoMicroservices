apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicecommandapi-deployment
  labels:
    app: voicecommandapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voicecommandapi
  template:
    metadata:
      labels:
        app: voicecommandapi
    spec:
      containers:
        - name: voicecommandapi
          image: berserkchmonya/voice-command-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: FLASK_ENV
              value: "production"
            - name: COMPOSE_NETWORK
              value: "true"
            - name: HTTP_RETRY_MAX_ATTEMPTS
              value: "3"
            - name: HTTP_RETRY_BACKOFF_SECONDS
              value: "1"
            - name: HTTP_RETRY_BACKOFF_FACTOR
              value: "2"
            - name: HTTP_RETRY_MAX_BACKOFF_SECONDS
              value: "10"
            - name: HTTP_RETRY_STATUS_CODES
              value: "429,500,502,503,504"
          readinessProbe:
            httpGet:
              path: /commands
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /commands
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: voicecommandapi
spec:
  selector:
    app: voicecommandapi
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
