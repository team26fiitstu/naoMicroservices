services:
  naoRobotAPI:
    build: 
      context: ./naoRobotAPI
      dockerfile: Dockerfile
    command: python server.py
    image: jperdek/nao-robot-api
    container_name: naoRobotAPI
    env_file: .env
    ports:
      - "8001:5000"
    environment:
      NAO_PORT: ${NAO_PORT:-9559}
      # NAO_IP: host.docker.internal
      NAO_IP: ${NAO_IP:-host.docker.internal}
      FLASK_ENV: development
    networks:
      buildernet:
        aliases:
          - naorobotapi
    extra_hosts:
      - "host.docker.internal:host-gateway"

  skeletonFinderAPI:
    build: 
      context: ./skeletonFinderAPI
      dockerfile: Dockerfile
    command: python server.py
    image: jperdek/skeleton-finder-api
    container_name: skeletonFinderAPI
    env_file: .env
    ports:
      - "8002:6001"
    environment:
      FLASK_ENV: development
    volumes:
      - ${POSE_IMAGES_HOST_DIR:-./data/pose-images}:/images:ro
    networks:
      buildernet:
        aliases:
          - skeletonfinderapi

  translatorAPI:
    build:
      context: ./translator
      dockerfile: Dockerfile
    command: python nao_pose_service.py
    image: jperdek/translator-api
    container_name: translatorAPI
    env_file: .env
    ports:
      - "8003:7000"
    environment:
      FLASK_ENV: development
      SERVICE_NETWORK: docker
      POSE_HOST_ROOT: /images
      POSE_CONT_ROOT: /images
    volumes:
      - ${POSE_IMAGES_HOST_DIR:-./data/pose-images}:/images
    depends_on:
      - naoRobotAPI
      - skeletonFinderAPI
    networks:
      - buildernet

networks:
  buildernet:
    driver: "bridge"
