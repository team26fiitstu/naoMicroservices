services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${REGISTRY:-jperdek}/web:${TAG:-latest}
    container_name: web_dev
    ports:
      - "8090:80"
    networks:
      - appnet
    depends_on:
      - naorobotapi
      - skeletonfinderapi
      - translatorapi

  naorobotapi:
    build:
      context: ./team-19-social-robot/naoRobotAPI
      dockerfile: Dockerfile
    image: ${REGISTRY:-jperdek}/nao-robot-api:${TAG:-latest}
    command: python server.py
    container_name: naorobotapi
    env_file: ./.env
    ports:
      - "5000:5000"
    environment:
      NAO_PORT: ${NAO_PORT:-9559}
      NAO_IP: ${NAO_IP:-host.docker.internal}
      FLASK_ENV: development
    networks:
      - appnet
    extra_hosts:
      - "host.docker.internal:host-gateway"

  skeletonfinderapi:
    build:
      context: ./team-19-social-robot/skeletonFinderAPI
      dockerfile: Dockerfile
    image: ${REGISTRY:-jperdek}/skeleton-finder-api:${TAG:-latest}
    command: python server.py
    container_name: skeletonfinderapi
    env_file: ./.env
    ports:
      - "6001:6001"
    environment:
      FLASK_ENV: development
      SERVICE_NETWORK: docker
    volumes:
      - ${POSE_IMAGES_HOST_DIR:-./data/pose-images}:/images:ro
    networks:
      - appnet

  translatorapi:
    build:
      context: ./team-19-social-robot/translator
      dockerfile: Dockerfile
    image: ${REGISTRY:-jperdek}/translator:${TAG:-latest}
    command: python nao_pose_service.py
    container_name: translatorapi
    env_file: ./.env
    ports:
      - "7000:7000"
    environment:
      FLASK_ENV: development
      SERVICE_NETWORK: docker
      POSE_HOST_ROOT: /images
      POSE_CONT_ROOT: /images
    volumes:
      - ${POSE_IMAGES_HOST_DIR:-./data/pose-images}:/images
    depends_on:
      - naorobotapi
      - skeletonfinderapi
      - exercise-config-service
    networks:
      - appnet

  voicecommandapi:
    build:
      context: ./team-19-social-robot/voiceCommandAPI
      dockerfile: Dockerfile
    image: ${REGISTRY:-jperdek}/voice-command-api:${TAG:-latest}
    container_name: voicecommandapi
    ports:
      - "8000:8000"
    env_file: ./.env
    environment:
      FLASK_ENV: development
      SERVICE_NETWORK: docker
    depends_on:
      - naorobotapi
    volumes:
      - ./team-19-social-robot/voiceCommandAPI:/app
    networks:
      - appnet

  exercise-config-service:
    build:
      context: ./team-19-social-robot/exerciseConfigService
      dockerfile: Dockerfile
    image: ${REGISTRY:-jperdek}/exercise-config-service:${TAG:-latest}
    command: python run.py
    container_name: exerciseconfigservice
    env_file: ./.env
    ports:
      - "7001:7001"
    environment:
      FLASK_ENV: development
      EXERCISES_DIR: /service/exercises
      SERVICE_NETWORK: docker
    depends_on:
      - voicecommandapi
    volumes:
      - ${EXERCISES_HOST_DIR:-./data/exercises}:/service/exercises
    networks:
      - appnet
  audio-to-text-converter:
    build:
      context: ./team-19-social-robot/audioToTextConverter
      dockerfile: Dockerfile
    image: ${REGISTRY:-jperdek}/audio-to-text-converter:${TAG:-latest}
    command: python text_from_audio_extractor_service.py
    container_name: audiototextconverter
    env_file: ./.env
    ports:
      - "9901:9901"
    environment:
      FLASK_ENV: development
      EXERCISES_DIR: /service/exercises
    depends_on:
      - voicecommandapi
    volumes:
      - ${EXERCISES_HOST_DIR:-./data/exercises}:/service/exercises
    networks:
      - appnet
networks:
  appnet:
    driver: bridge
