services:
  web:
    build: ./web
    image: ${REGISTRY:-jperdek}/web:${TAG:-latest}
    env_file:
      - path: ./.env
        required: false
    ports:
      - "8090:80"
    depends_on:
      - translatorapi

  naorobotapi:
    # Bundled NAOqi Python 2 native libraries are x86-64 only.
    platform: linux/amd64
    build: ./services/naoRobotAPI
    image: ${REGISTRY:-jperdek}/nao-robot-api:${TAG:-latest}
    command: python server.py production
    env_file:
      - path: ./.env
        required: false
    environment:
      COMPOSE_NETWORK: "true"
      NAO_IP: ${NAO_IP:-host.docker.internal}
      NAO_PORT: ${NAO_PORT:-9559}
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  skeletonfinderapi:
    # The pinned MediaPipe release is distributed for x86-64 Linux.
    platform: linux/amd64
    build: ./services/skeletonFinderAPI
    image: ${REGISTRY:-jperdek}/skeleton-finder-api:${TAG:-latest}
    command: python server.py
    env_file:
      - path: ./.env
        required: false
    environment:
      COMPOSE_NETWORK: "true"
    ports:
      - "6001:6001"
    volumes:
      - ./images:/images:ro

  translatorapi:
    build: ./services/translator
    image: ${REGISTRY:-jperdek}/translator:${TAG:-latest}
    command: python nao_pose_service.py
    env_file:
      - path: ./.env
        required: false
    environment:
      COMPOSE_NETWORK: "true"
      POSE_IMAGE_DIR: /images
    ports:
      - "7000:7000"
    volumes:
      - ./images:/images
    depends_on:
      - naorobotapi
      - skeletonfinderapi
      - exercise-config-service

  voicecommandapi:
    build: ./services/voiceCommandAPI
    image: ${REGISTRY:-jperdek}/voice-command-api:${TAG:-latest}
    env_file:
      - path: ./.env
        required: false
    environment:
      COMPOSE_NETWORK: "true"
    ports:
      - "8000:8000"
    depends_on:
      - naorobotapi

  exercise-config-service:
    build: ./services/exerciseConfigService
    image: ${REGISTRY:-jperdek}/exercise-config-service:${TAG:-latest}
    command: python run.py
    env_file:
      - path: ./.env
        required: false
    environment:
      COMPOSE_NETWORK: "true"
      EXERCISES_DIR: /service/exercises
    ports:
      - "7001:7001"
    volumes:
      - ${EXERCISES_HOST_DIR:-./exercises}:/service/exercises
    depends_on:
      - voicecommandapi

  audio-to-text-converter:
    # The pinned TorchCodec release has no ARM64 Linux wheel.
    platform: linux/amd64
    build: ./services/audioToTextConverter
    image: ${REGISTRY:-jperdek}/audio-to-text-converter:${TAG:-latest}
    command: python text_from_audio_extractor_service.py
    env_file:
      - path: ./.env
        required: false
    environment:
      COMPOSE_NETWORK: "true"
    ports:
      - "9901:9901"
